services:
    frontend:
        ports:
            - "80:80"
        configs:
            - source: nginx_config
            target: /etc/nginx/conf.d/default.conf
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        deploy:
            restart_policy:
                condition: on-failure
            replicas: 3
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    cpus: "0.25"
                    memory: 128M
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first
        networks:
            - pharmacy-net
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    spring-boot:
        environment:
            MONGODB_DATABASE: ${MONGODB_DATABASE}
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
        secrets:
            - mongo_uri
            - jwt
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        deploy:
            restart_policy:
                condition: on-failure
            replicas: 3
            resources:
                limits:
                    cpus: "1.0"
                    memory: 768M
                reservations:
                    cpus: "0.5"
                    memory: 384M
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first
        networks:
            - pharmacy-net
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 40s

    mongodb:
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_password
            MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
        secrets:
            - db_password
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        deploy:
            restart_policy:
                condition: on-failure
            replicas: 1
            resources:
                limits:
                    cpus: "2.0"
                    memory: 1G
                reservations:
                    cpus: '1.0'
                    memory: 0.5G
                placement:
                    constraints:
                        - node.role == manager
        networks:
            - pharmacy-net
        volumes:
            - mongo_data_prod:/data/db
        healthcheck:
            test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

networks:
    pharmacy-net:
        driver: overlay 
        
volumes:
    mongo_data_prod:
        driver: local
    
configs:
    nginx_config:
        file: ./nginx/nginx.conf
    
secrets:
    db_password:
        file: ./secrets/db_password.txt
    jwt:
        file: ./secrets/jwt.txt
    mongo_uri:
        file: ./secrets/mongo_uri.txt
        